<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>Nguyễn Tài | Account Specialist Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#e6eefc;font-family:Inter,system-ui,-apple-system,sans-serif;">
              <div style="max-width:720px;line-height:1.6;background:#11182b;border:1px solid #2a3554;border-radius:16px;padding:24px;">
                <h1 style="margin:0 0 12px;font-size:24px;">This app must run on a local server</h1>
                <p style="margin:0 0 8px;">You opened <code>index.html</code> with <code>file://</code>, so the React/Vite modules cannot load.</p>
                <p style="margin:0;">Run <code>npm install</code> then <code>npm run dev</code>, and open <code>http://localhost:3001</code>.</p>
              </div>
            </div>
          `;
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
